<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>מדריך חירום וועדות לבון 2026</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#EDE8DC;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    direction:rtl;
    color:#242220;
    display:flex;
    justify-content:center;
  }
  .app{width:100%;max-width:560px;background:#FAF7F0;min-height:100vh;position:relative;}

  header{
    position:sticky;top:0;z-index:20;
    background:#1F3B36;
    padding:16px 18px 14px;
    border-bottom:4px solid #D9B45C;
  }
  header h1{color:#FAF7F0;font-size:21px;font-weight:700;margin-bottom:2px;}
  header .sub{color:#B9CFC7;font-size:12.5px;margin-bottom:12px;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:18px;height:18px;stroke:#7C9490;}
  #search{
    width:100%;height:44px;border-radius:22px;border:none;
    background:#2A4A43;color:#FAF7F0;font-size:15px;
    padding:0 44px 0 16px;outline:none;
  }
  #search::placeholder{color:#7C9490;}
  #search:focus{box-shadow:0 0 0 2px #D9B45C;}

  .quickdial{
    display:flex;gap:10px;overflow-x:auto;padding:16px 18px;
    scrollbar-width:none;
  }
  .quickdial::-webkit-scrollbar{display:none;}
  .qd-btn{
    flex:0 0 auto;width:78px;text-align:center;text-decoration:none;color:inherit;
  }
  .qd-circle{
    width:60px;height:60px;border-radius:50%;background:#C23616;
    display:flex;align-items:center;justify-content:center;margin:0 auto 6px;
    box-shadow:0 0 0 0 rgba(194,54,22,0.5);
    animation:pulse 2.6s infinite;
  }
  .qd-circle svg{width:26px;height:26px;stroke:white;}
  .qd-name{font-size:11.5px;color:#5A5650;font-weight:700;}
  .qd-num{font-size:14px;color:#1F3B36;font-weight:700;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(194,54,22,0.45);}
    70%{box-shadow:0 0 0 10px rgba(194,54,22,0);}
    100%{box-shadow:0 0 0 0 rgba(194,54,22,0);}
  }
  @media (prefers-reduced-motion:reduce){.qd-circle{animation:none;}}

  .section-divider {
    padding: 16px 18px 4px;
    font-size: 17px;
    font-weight: 800;
    color: #1F3B36;
    border-bottom: 2px solid #D9B45C;
    margin: 10px 14px 0;
  }

  .categories{padding:10px 14px 30px;display:flex;flex-direction:column;gap:12px;}

  .cat{border-radius:16px;overflow:hidden;}
  .cat-head{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    cursor:pointer;user-select:none;background:none;border:none;width:100%;
    text-align:right;font-family:inherit;
  }
  .cat-icon{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;flex:0 0 auto;
  }
  .cat-icon svg{width:19px;height:19px;stroke:white;}
  .cat-title{flex:1;font-size:16px;font-weight:700;}
  .cat-count{font-size:12px;font-weight:700;opacity:0.75;}
  .chev{width:16px;height:16px;transition:transform .25s ease;flex:0 0 auto;}
  .cat.open .chev{transform:rotate(180deg);}

  .cat-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .cat.open .cat-body{max-height:1400px;}
  .cat-list{padding:2px 16px 14px;display:flex;flex-direction:column;}

  .row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 4px;border-top:1px solid rgba(0,0,0,0.06);
  }
  .row:first-child{border-top:none;}
  .row-info{flex:1;min-width:0;}
  .row-name{font-size:14.5px;font-weight:700;}
  .row-hours{font-size:11.5px;color:#7A776E;margin-top:1px;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;}
  .num-pill{
    display:flex;align-items:center;gap:5px;text-decoration:none;
    background:rgba(255,255,255,0.65);border-radius:20px;padding:6px 10px;
    font-size:13px;font-weight:700;white-space:nowrap;
  }
  .num-pill svg{width:13px;height:13px;}
  .wa-pill{background:rgba(255,255,255,0.65);}

  .hidden{display:none !important;}
  .empty-msg{text-align:center;color:#9A968C;font-size:14px;padding:40px 20px;}

  .c1 .cat-head{background:#FBEAE4;} .c1 .cat-icon{background:#C23616;} .c1 .cat-title,.c1 .cat-count,.c1 .chev{color:#8C2F1B;stroke:#8C2F1B;} .c1 .row-name{color:#7A2A18;} .c1 .num-pill{color:#8C2F1B;}
  .c2 .cat-head{background:#F2ECD8;} .c2 .cat-icon{background:#8A6D3B;} .c2 .cat-title,.c2 .cat-count,.c2 .chev{color:#6B4F1D;stroke:#6B4F1D;} .c2 .row-name{color:#5E4519;} .c2 .num-pill{color:#6B4F1D;}
  .c3 .cat-head{background:#DFEEEA;} .c3 .cat-icon{background:#147363;} .c3 .cat-title,.c3 .cat-count,.c3 .chev{color:#0F4F45;stroke:#0F4F45;} .c3 .row-name{color:#0C433A;} .c3 .num-pill{color:#0F4F45;}
  .c4 .cat-head{background:#EEE3F3;} .c4 .cat-icon{background:#6A4C93;} .c4 .cat-title,.c4 .cat-count,.c4 .chev{color:#4A2E66;stroke:#4A2E66;} .c4 .row-name{color:#402858;} .c4 .num-pill{color:#4A2E66;}
  .c5 .cat-head{background:#E4ECDD;} .c5 .cat-icon{background:#4B6043;} .c5 .cat-title,.c5 .cat-count,.c5 .chev{color:#33462B;stroke:#33462B;} .c5 .row-name{color:#2C3D25;} .c5 .num-pill{color:#33462B;}
  .c6 .cat-head{background:#FBF0D9;} .c6 .cat-icon{background:#B8860B;} .c6 .cat-title,.c6 .cat-count,.c6 .chev{color:#7A5A06;stroke:#7A5A06;} .c6 .row-name{color:#6B4F05;} .c6 .num-pill{color:#7A5A06;}

function toTel(n){
  if(n.endsWith('*')) return '*'+n.slice(0,-1).replace(/[^0-9]/g,'');
  return n.replace(/[^0-9+]/g,'');
}
function toWa(n){
  let d = n.replace(/[^0-9]/g,'');
  if(d.startsWith('0')) d = '972'+d.slice(1);
  return 'https://wa.me/'+d;
}

      <div class="cat-icon">${ic('users')}</div>
      <div class="cat-title">${cat.title}</div>
      <div class="cat-count">${cat.items.length}</div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="cat-body">
      <div class="cat-list">
        ${cat.items.map(item => `
          <div class="row" data-name="${item.name}" data-numbers="${item.numbers.join(' ')}">
            <div class="row-info">
              <div class="row-name">${item.name}</div>
            </div>
            <div class="row-actions">
              ${item.numbers.map(n => `<a class="num-pill" href="tel:${toTel(n)}">${ic('phone')}${n}</a>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>
  </div>`).join('');

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-toggle]');
  if(!btn) return;
  const cat = btn.closest('.cat');
  cat.classList.toggle('open');
});

const searchEl = document.getElementById('search');
const emptyMsgEl = document.getElementById('emptyMsg');
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.cat').forEach(catEl => {
    let catHasMatch = false;
    const rows = catEl.querySelectorAll('.row');
    rows.forEach(row => {
      const hay = (row.dataset.name + ' ' + row.dataset.numbers + ' ' + catEl.querySelector('.cat-title').textContent).toLowerCase();
      const match = q === '' || hay.includes(q);
      row.classList.toggle('hidden', !match);
      if(match) catHasMatch = true;
    });
    catEl.classList.toggle('hidden', !catHasMatch);
    if(q !== ''){
      catEl.classList.toggle('open', catHasMatch);
    } else {
      catEl.classList.toggle('open', catEl.dataset.id === 'e1');
    }
    if(catHasMatch) anyVisible = true;
  });
  emptyMsgEl.classList.toggle('hidden', anyVisible);
});
</script>
</body>
</html>
